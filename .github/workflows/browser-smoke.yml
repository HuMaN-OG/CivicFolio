name: CivicFolio Browser Smoke
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/civicfolio-http.log 2>&1 &
          echo $! >/tmp/civicfolio-http.pid
          sleep 2
      - name: Run full browser smoke test
        run: node tests/browser.smoke.cjs
      - name: Upload demo screenshots and sample PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicfolio-browser-evidence
          path: artifacts/
          if-no-files-found: ignore
